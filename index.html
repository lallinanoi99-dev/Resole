<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Resole · Second-hand shoes &amp; apparel on BOT Chain</title>
<meta name="description" content="Sell your second-hand shoes and apparel. Set your own price in BOT, get paid on-chain, and every sale lives on BOT Chain forever.">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23F06EBF'/%3E%3Cpath d='M16 4c5 0 8.5 3.6 8.5 9 0 3.6-1.8 5.5-1.8 8.2 0 2.6.8 3.4.8 5.3 0 2.2-2.6 3.5-7.5 3.5s-7.5-1.3-7.5-3.5c0-1.9.8-2.7.8-5.3 0-2.7-1.8-4.6-1.8-8.2C7.5 7.6 11 4 16 4z' fill='%23000'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,500;0,600;0,700;0,800;1,600;1,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFFFF;
    --ink: #000000;
    --muted: #6E6E6E;
    --line: #E4E4E4;
    --tile: #ECEBEA;
    --pink: #F06EBF;
    --red: #D9381E;
    --ok: #0E8A4B;
    --sans: 'Inter Tight', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --gutter: 20px;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 500 15px/1.45 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; }
  img { display: block; max-width: 100%; }
  .muted { color: var(--muted); }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 0 var(--gutter); }
  .bleed { width: 100vw; margin-left: calc(50% - 50vw); }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* ---------- announcement + header ---------- */
  .announce { background: var(--ink); color: #fff; text-align: center; font: 600 13px/1 var(--sans); padding: 11px var(--gutter); }
  .announce span { text-decoration: underline; text-underline-offset: 3px; }
  .preview-bar { background: #FFF4C2; color: #5A4A00; font: 600 12px/1.4 var(--sans); text-align: center; padding: 8px var(--gutter); }

  header.top { position: sticky; top: 0; z-index: 30; background: var(--bg); }
  .bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; height: 60px; padding: 0 var(--gutter); }
  .nav-left, .head-links { display: flex; align-items: center; gap: 18px; min-width: 0; }
  .head-links { justify-content: flex-end; gap: 14px; }
  .nav-left a, .navlink { font: 700 17px/1 var(--sans); text-transform: uppercase; letter-spacing: -.01em; background: none; border: 0; padding: 0; cursor: pointer; white-space: nowrap; }
  .nav-left a[aria-current="page"], .navlink:hover, .nav-left a:hover { text-decoration: underline; text-underline-offset: 4px; }
  .logo { font: 800 34px/1 var(--sans); letter-spacing: -.045em; justify-self: center; }
  .navlink .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-right: 7px; vertical-align: 2px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 20px; border-radius: 999px; border: 1.5px solid var(--ink); background: transparent; color: var(--ink); font: 700 13px/1 var(--sans); letter-spacing: .02em; text-transform: uppercase; cursor: pointer; white-space: nowrap; transition: background .15s, color .15s; }
  .btn:hover { background: var(--ink); color: #fff; }
  .btn:disabled { opacity: .4; cursor: not-allowed; background: transparent; color: var(--ink); }
  .btn.coral { background: var(--ink); color: #fff; }
  .btn.coral:hover { background: #333; border-color: #333; }
  .btn.coral:disabled { background: var(--ink); color: #fff; }
  .btn.big { min-height: 50px; padding: 0 28px; font-size: 14px; }
  .btn.block { width: 100%; }
  .btn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .seg { display: inline-flex; border: 1.5px solid var(--ink); border-radius: 999px; padding: 2px; gap: 2px; background: #fff; }
  .seg button { border: 0; background: transparent; color: var(--ink); font: 700 12px/1 var(--sans); letter-spacing: .02em; padding: 0 12px; min-height: 30px; border-radius: 999px; cursor: pointer; text-transform: uppercase; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }

  /* ---------- colour-block bands ---------- */
  .band { display: flex; overflow: hidden; white-space: nowrap; border: 0; padding: 0; margin: 0; background: none; cursor: pointer; text-align: left; width: 100vw; margin-left: calc(50% - 50vw); }
  .band span { flex: none; font: 800 clamp(38px, 5.6vw, 116px)/.9 var(--sans); letter-spacing: -.045em; text-transform: uppercase; padding: .06em .05em .02em; }
  .band:hover span { filter: saturate(1.15); }
  .band .chev { display: inline-block; transition: transform .2s; }
  .band[aria-expanded="false"] .chev { transform: rotate(-90deg); }

  /* ---------- home ---------- */
  .strip { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--tile); }
  .strip a, .strip div.tile { position: relative; aspect-ratio: 4 / 5; overflow: hidden; background: var(--tile); }
  .strip img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s; }
  .strip a:hover img { transform: scale(1.03); }
  .strip .tag-cap { position: absolute; left: 12px; bottom: 12px; background: #fff; border-radius: 999px; padding: 7px 12px; font: 700 12px/1 var(--sans); text-transform: uppercase; opacity: 0; transform: translateY(6px); transition: opacity .2s, transform .2s; }
  .strip a:hover .tag-cap, .strip a:focus-visible .tag-cap { opacity: 1; transform: none; }
  .intro { text-align: center; padding: 56px 0 18px; }
  .intro h1 { font: 800 clamp(40px, 6.4vw, 88px)/.95 var(--sans); letter-spacing: -.05em; margin: 0 0 14px; }
  .intro p { max-width: 560px; margin: 0 auto 24px; font-size: 18px; color: #222; }
  .intro .ctas { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .stats { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px 22px; margin-top: 26px; font: 700 13px/1 var(--sans); text-transform: uppercase; }
  .stats b { font-weight: 800; }

  .sec-head { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; margin: 64px 0 14px; }
  .sec-head h2, .sec-head .sec-title { margin: 0; text-align: center; font: 700 20px/1.1 var(--sans); text-transform: uppercase; letter-spacing: -.01em; background: none; border: 0; cursor: pointer; padding: 0; }
  .sec-head .sec-title[aria-expanded] .chev { display: inline-block; margin-left: 6px; transition: transform .2s; }
  .sec-head .sec-title[aria-expanded="false"] .chev { transform: rotate(-90deg); }
  .arrow { width: 40px; height: 30px; border: 0; background: none; cursor: pointer; font: 600 24px/1 var(--sans); }
  .arrow:hover { color: var(--muted); }
  .carousel { display: grid; grid-auto-flow: column; grid-auto-columns: clamp(240px, 24vw, 360px); gap: 4px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; scroll-behavior: smooth; }
  .carousel::-webkit-scrollbar { display: none; }
  .carousel > * { scroll-snap-align: start; }

  .cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .cat { border: 0; padding: 0; background: none; cursor: pointer; text-align: center; }
  .cat .media { aspect-ratio: 1; }
  .cat b { display: block; padding: 14px 8px 4px; font: 700 18px/1.1 var(--sans); text-transform: uppercase; }
  .cat[aria-pressed="true"] b { text-decoration: underline; text-underline-offset: 5px; }
  .cat:hover img { transform: scale(1.03); }

  .filters { display: flex; justify-content: center; flex-wrap: wrap; gap: 4px 18px; margin: 0 0 18px; }
  .chips { display: flex; gap: 4px 16px; flex-wrap: wrap; justify-content: center; }
  .chip-btn { border: 0; background: none; color: var(--muted); padding: 6px 0; font: 700 14px/1 var(--sans); text-transform: uppercase; cursor: pointer; }
  .chip-btn[aria-pressed="true"] { color: var(--ink); text-decoration: underline; text-underline-offset: 5px; }
  .chip-btn:hover { color: var(--ink); }
  .chip-sep { width: 1.5px; background: var(--line); margin: 2px 4px; }

  .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 32px 4px; }

  /* ---------- item card ---------- */
  .card { position: relative; display: flex; flex-direction: column; min-width: 0; }
  .media { position: relative; aspect-ratio: 1; background: var(--tile); overflow: hidden; }
  .media img { width: 100%; height: 100%; object-fit: cover; transition: transform .45s; }
  .card:hover .media img { transform: scale(1.03); }
  .media .ph { position: absolute; inset: 0; display: grid; place-items: center; color: #9b9b9b; font: 700 12px/1 var(--sans); text-transform: uppercase; }
  .rank { position: absolute; z-index: 2; top: 12px; right: 12px; background: #fff; border-radius: 999px; padding: 6px 10px; font: 800 13px/1 var(--sans); }
  .rank .up { color: var(--ok); }
  .tag { position: absolute; z-index: 2; top: 12px; left: 12px; background: var(--ink); color: #fff; border-radius: 999px; padding: 6px 10px; font: 800 11px/1 var(--sans); letter-spacing: .03em; }
  .pager { position: absolute; z-index: 2; bottom: 8px; left: 0; right: 0; display: flex; justify-content: center; gap: 2px; }
  .pager button { width: 22px; height: 22px; border: 0; background: transparent; padding: 0; cursor: pointer; display: grid; place-items: center; }
  .pager button::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: rgba(0,0,0,.25); }
  .pager button[aria-current="true"]::before { background: var(--ink); }
  .card .body { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 14px; row-gap: 2px; padding: 12px 6px 0; font-size: 15px; line-height: 1.3; }
  .card .price { grid-row: 1 / span 3; font-weight: 700; white-space: nowrap; }
  .card .title { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .cap { font-style: italic; font-weight: 600; }
  .card .who { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .price .cur { margin-left: 3px; }
  .cap { font-weight: 600; }
  .avatar { flex: none; width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; font: 800 11px/1 var(--sans); color: #fff; vertical-align: middle; }
  .sold .media img { filter: grayscale(1); opacity: .55; }
  .stamp { position: absolute; z-index: 3; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-10deg); background: #7A1E14; color: #F7A6E8; padding: .1em .35em .04em; font: 800 clamp(26px, 3vw, 44px)/1 var(--sans); letter-spacing: -.03em; pointer-events: none; }
  .stamp.big { font-size: clamp(48px, 8vw, 96px); }
  .sold .price { color: var(--muted); text-decoration: line-through; }

  .skeleton .media, .skeleton .line { background: linear-gradient(90deg, #eeedec, #f6f5f4, #eeedec); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
  .skeleton .body { display: grid; gap: 8px; padding: 12px 6px 0; }
  .skeleton .line { height: 12px; border-radius: 6px; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  .empty { border: 1.5px dashed #cfcfcf; padding: 56px 20px; text-align: center; color: var(--muted); }
  .empty b { display: block; color: var(--ink); font-size: 20px; margin-bottom: 6px; text-transform: uppercase; }
  .empty .btn { margin-top: 16px; }

  /* ---------- item page ---------- */
  .back { display: inline-flex; margin: 26px 0 16px; font: 700 14px/1 var(--sans); text-transform: uppercase; }
  .back:hover { text-decoration: underline; text-underline-offset: 4px; }
  .item { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 44px; align-items: start; }
  .thumbs { display: flex; gap: 4px; margin-top: 4px; }
  .thumbs button { width: 84px; height: 84px; padding: 0; overflow: hidden; border: 2px solid transparent; background: var(--tile); cursor: pointer; }
  .thumbs button[aria-current="true"] { border-color: var(--ink); }
  .thumbs img { width: 100%; height: 100%; object-fit: cover; }
  .item h1 { font: 800 clamp(32px, 4.4vw, 56px)/1 var(--sans); letter-spacing: -.045em; margin: 8px 0 18px; }
  .item > div:last-child > .cap { font-style: normal; text-transform: uppercase; font-size: 13px; }
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink); }
  .facts div { padding: 12px 0; }
  .facts small { display: block; font: 700 11px/1 var(--sans); text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .facts b { font: 700 16px/1.2 var(--sans); text-transform: uppercase; }
  .desc { white-space: pre-wrap; margin: 18px 0; font-size: 16px; overflow-wrap: anywhere; }
  .panel { padding: 18px 0; border-bottom: 1px solid var(--line); }
  .lbl, .f > span { font: 700 12px/1 var(--sans); text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
  .bigprice { font: 800 44px/1 var(--sans); letter-spacing: -.03em; margin: 8px 0 16px; }
  .bigprice .cur { font-size: 20px; }
  .seller-box { display: flex; align-items: center; gap: 12px; }
  .seller-box .avatar { width: 44px; height: 44px; font-size: 18px; }
  .seller-box b { display: block; font-size: 18px; }
  .seller-box .cap { display: block; font-size: 12px; text-transform: uppercase; color: var(--muted); }
  .addr { font: 500 13px/1.4 var(--sans); color: var(--muted); }
  .addr a, a.ext { text-decoration: underline; text-underline-offset: 3px; }
  .contact { margin-top: 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; font: 600 15px/1.3 var(--sans); overflow-wrap: anywhere; }
  .contact small { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; margin-bottom: 3px; }
  .status { margin-top: 10px; font: 500 13px/1.45 var(--sans); color: var(--muted); }
  .status.err { color: var(--red); font-weight: 600; }
  .status.ok { color: var(--ok); }
  .notice { font: 500 13px/1.55 var(--sans); background: var(--tile); padding: 14px 16px; margin-top: 16px; }
  .notice b { font-weight: 800; }
  .yours-box { display: flex; align-items: center; justify-content: center; min-height: 50px; border-radius: 999px; border: 1.5px dashed var(--ink); font: 700 13px/1 var(--sans); text-transform: uppercase; }

  /* ---------- forms ---------- */
  .page-title { font: 800 clamp(34px, 5vw, 64px)/1 var(--sans); letter-spacing: -.045em; margin: 8px 0 8px; }
  .form { display: grid; gap: 20px; }
  .sell { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, .8fr); gap: 44px; align-items: start; margin-bottom: 40px; }
  label.f, div.f { display: grid; gap: 8px; }
  input[type=text], textarea { width: 100%; background: #fff; border: 1.5px solid #cfcfcf; border-radius: 0; color: var(--ink); font: 500 16px/1.4 var(--sans); padding: 12px 14px; }
  textarea { resize: vertical; min-height: 100px; }
  input[type=text]:focus, textarea:focus { outline: none; border-color: var(--ink); }
  .err-text { color: var(--red); font: 600 13px/1.4 var(--sans); }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .opts .chip-btn { min-height: 40px; padding: 0 16px; border: 1.5px solid #cfcfcf; border-radius: 999px; color: var(--ink); text-decoration: none; }
  .opts .chip-btn[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .price-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: stretch; }
  .price-row input { font: 800 22px/1 var(--sans); }
  .photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .slot { position: relative; aspect-ratio: 1; border: 1.5px dashed #bdbdbd; background: #fafafa; display: grid; place-items: center; overflow: hidden; color: var(--ink); font: 700 12px/1.3 var(--sans); text-transform: uppercase; text-align: center; cursor: pointer; white-space: pre-line; }
  .slot:hover { border-color: var(--ink); background: var(--tile); }
  .slot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .slot .x { position: absolute; top: 6px; right: 6px; width: 28px; height: 28px; border-radius: 50%; border: 0; background: var(--ink); color: #fff; cursor: pointer; font-size: 15px; }
  .slot .cover { position: absolute; left: 6px; bottom: 6px; background: var(--ink); color: #fff; border-radius: 999px; padding: 4px 8px; font-size: 10px; }
  .preview-card { position: sticky; top: 84px; }
  .preview-card .lbl { margin-bottom: 10px; }
  .check { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; font-size: 15px; }
  .check input { width: 20px; height: 20px; accent-color: var(--ink); flex: none; margin-top: 1px; }
  .perm { background: #7A1E14; color: #fff; padding: 22px; }
  .perm h3 { margin: 0 0 6px; font: 800 26px/1.05 var(--sans); letter-spacing: -.03em; text-transform: uppercase; color: #F7A6E8; }
  .perm p { margin: 0 0 16px; }
  .perm .check input { accent-color: #F7A6E8; }
  .progress { display: grid; gap: 8px; margin-top: 16px; font: 600 14px/1.3 var(--sans); }
  .progress div { display: flex; gap: 10px; align-items: center; color: var(--muted); }
  .progress div.on { color: var(--ink); }
  .progress div.done { color: var(--ok); }
  .progress div.bad { color: var(--red); }
  .progress i { font-style: normal; width: 16px; text-align: center; }

  /* ---------- my stuff ---------- */
  .tabs { display: flex; gap: 22px; border-bottom: 1.5px solid var(--ink); margin: 26px 0 18px; }
  .tabs button { border: 0; background: transparent; color: var(--muted); padding: 12px 0; font: 700 16px/1 var(--sans); text-transform: uppercase; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1.5px; }
  .tabs button[aria-selected="true"] { color: var(--ink); border-color: var(--ink); }
  .rows { display: grid; gap: 0; border-top: 1px solid var(--line); }
  .row { display: grid; grid-template-columns: 90px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .row .title { font-weight: 800; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
  .row .sub { font: 500 13px/1.5 var(--sans); color: var(--muted); overflow-wrap: anywhere; }
  .row .sub b { color: var(--ink); font-weight: 700; }
  .pill { display: inline-block; font: 800 11px/1 var(--sans); padding: 7px 11px; border-radius: 999px; text-transform: uppercase; background: var(--tile); }
  .pill.live { background: #D6F5E3; color: var(--ok); }
  .pill.gone { background: #7A1E14; color: #F7A6E8; }
  .me-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 28px; }
  .me-head .seller-box b { font: 800 30px/1 var(--sans); letter-spacing: -.04em; }

  /* ---------- success ---------- */
  .success { max-width: 640px; margin: 40px auto; text-align: center; }
  .success .media { max-width: 320px; margin: 0 auto 22px; }
  .success > .cap { text-transform: uppercase; font-size: 13px; }
  .success h1 { font: 800 clamp(52px, 10vw, 110px)/.9 var(--sans); letter-spacing: -.06em; margin: 8px 0; }
  .success p { color: #222; font-size: 17px; }
  .success .panel { text-align: left; margin: 18px 0; border-top: 1px solid var(--line); }
  .success .ctas { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  /* ---------- modal + toast ---------- */
  .modal-back { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.45); display: grid; place-items: center; padding: var(--gutter); overflow-y: auto; }
  .modal { width: min(520px, 100%); background: #fff; padding: 28px; position: relative; }
  .modal.wide { width: min(760px, 100%); }
  .modal h2 { margin: 0 0 6px; font: 800 30px/1.05 var(--sans); letter-spacing: -.04em; }
  .modal .x-close { position: absolute; top: 14px; right: 14px; width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--ink); background: #fff; cursor: pointer; font-size: 16px; }
  .modal .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 20px; }
  .mode-card { text-align: left; border: 0; border-radius: 0; padding: 22px 18px; cursor: pointer; min-height: 180px; display: flex; flex-direction: column; justify-content: space-between; transition: transform .15s; }
  .mode-card:first-child { background: #0E8A4B; color: #FBEFD2; }
  .mode-card:last-child { background: #2479C0; color: #BDF0E2; }
  .mode-card:hover { transform: translateY(-3px); }
  .mode-card b { font: 800 30px/.95 var(--sans); letter-spacing: -.04em; }
  .mode-card span { font-size: 14px; font-weight: 600; }
  .mode-card .ico { font-size: 30px; }
  .crop { position: relative; width: min(420px, 100%); aspect-ratio: 1; margin: 16px auto 12px; overflow: hidden; background: var(--tile); touch-action: none; cursor: grab; }
  .crop::after { content: ''; position: absolute; inset: 0; border: 2px solid var(--ink); pointer-events: none; }
  .zoom { display: flex; align-items: center; gap: 12px; width: min(420px, 100%); margin: 0 auto; font: 700 14px/1 var(--sans); }
  .zoom input { flex: 1; accent-color: var(--ink); }
  .toasts { position: fixed; z-index: 80; left: 50%; bottom: 24px; transform: translateX(-50%); display: grid; gap: 8px; width: min(520px, calc(100% - 32px)); }
  .toast { background: var(--ink); color: #fff; border-radius: 999px; padding: 13px 20px; font: 600 14px/1.4 var(--sans); box-shadow: 0 12px 30px rgba(0,0,0,.18); animation: pop .2s ease-out; text-align: center; }
  .toast a { text-decoration: underline; }
  @keyframes pop { from { opacity: 0; transform: translateY(8px); } }

  /* ---------- footer ---------- */
  footer.foot { margin-top: 96px; }
  .chain-drop { display: grid; grid-template-columns: 1fr minmax(0, 160px) 1fr; align-items: center; gap: 4px; background: #fff; }
  .chain-drop .side { display: grid; place-items: center; font: 700 18px/1.2 var(--sans); text-transform: uppercase; text-align: center; padding: 20px; }
  .chain-card { display: block; }
  .chain-card .stage { position: relative; aspect-ratio: 1; display: grid; place-items: center; background: var(--tile); overflow: hidden; }
  .chain-card .stage::after { content: ''; position: absolute; width: 46%; height: 7%; bottom: 17%; left: 50%; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(closest-side, rgba(0,0,0,.28), transparent); transition: transform .35s, opacity .35s; }
  .chain-card img { position: relative; z-index: 1; width: 36%; height: auto; border-radius: 22%; transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s; box-shadow: 0 18px 30px rgba(0,0,0,.18); }
  .chain-card:hover img { transform: translateY(-14px) rotate(-3deg); box-shadow: 0 30px 50px rgba(0,0,0,.22), 0 0 60px rgba(240,110,191,.55); }
  .chain-card:hover .stage::after { transform: translateX(-50%) scale(.8); opacity: .6; }
  .chain-card .body { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 10px; row-gap: 2px; padding: 8px 2px 0; font-size: 12px; }
  .chain-card .body > span[title] { grid-column: 1 / -1; color: var(--muted); }
  .chain-card .body b { font-weight: 800; }
  .chain-card .body .cap { font-style: italic; }
  .foot-cta { display: flex; justify-content: center; margin: 22px 0 0; }
  .foot-cols { display: grid; grid-template-columns: 1.4fr repeat(3, 1fr); gap: 28px; margin-top: 80px; }
  .foot-cols h4 { margin: 0 0 12px; font: 800 17px/1 var(--sans); text-transform: uppercase; }
  .foot-cols p { margin: 0; color: #222; max-width: 320px; }
  .foot-cols ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-weight: 600; }
  .foot-cols a:hover, .foot-cols button:hover { text-decoration: underline; text-underline-offset: 3px; }
  .foot-cols button { border: 0; background: none; padding: 0; cursor: pointer; font: inherit; text-align: left; }
  .giant { position: relative; margin-top: 80px; }
  .giant svg.word { display: block; width: 100%; height: auto; }
  .giant .soles { position: absolute; left: 0; right: 0; top: 18%; display: flex; justify-content: space-around; pointer-events: none; }
  .giant .soles svg { width: 8.5vw; height: auto; animation: hop 3.2s ease-in-out infinite; }
  .giant .soles svg:nth-child(even) { animation-delay: -1.6s; }
  @keyframes hop { 50% { transform: translateY(-6%) rotate(-6deg); } }
  @media (prefers-reduced-motion: reduce) { .giant .soles svg { animation: none; } }
  .legal { text-align: center; font: 700 12px/1.6 var(--sans); text-transform: uppercase; padding: 18px var(--gutter) 28px; }

  /* ---------- mobile dock ---------- */
  .dock { display: none; }
  @media (max-width: 1000px) {
    .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .strip { grid-template-columns: repeat(3, 1fr); }
    .strip > :nth-child(4) { display: none; }
  }
  @media (max-width: 760px) {
    :root { --gutter: 14px; }
    .bar { height: 54px; grid-template-columns: 1fr auto 1fr; }
    .logo { font-size: 26px; }
    .nav-left .nl-sell, .nav-left .nl-me, .head-links .seg, .head-links .me-link { display: none; }
    .nav-left a, .navlink { font-size: 14px; }
    .strip { grid-template-columns: repeat(2, 1fr); }
    .strip > :nth-child(n+3) { display: none; }
    .intro { padding-top: 40px; }
    .intro p { font-size: 16px; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 4px; }
    .cats { grid-template-columns: repeat(2, 1fr); }
    .card .body { display: block; padding: 10px 4px 0; font-size: 14px; }
    .card .price { display: block; margin-bottom: 2px; }
    .item, .sell { grid-template-columns: 1fr; gap: 22px; }
    .preview-card { position: static; }
    .modes { grid-template-columns: 1fr; }
    .mode-card { min-height: 130px; }
    .facts b { font-size: 13px; }
    .chain-drop { grid-template-columns: 1fr; justify-items: center; }
    .chain-drop > div { width: min(150px, 100%); }
    .chain-drop .side { display: none; }
    .foot-cols { grid-template-columns: 1fr 1fr; gap: 28px 16px; margin-top: 56px; }
    .foot-cols > :first-child { grid-column: 1 / -1; }
    .row { grid-template-columns: 64px minmax(0, 1fr); }
    .row > :last-child { grid-column: 1 / -1; justify-self: start; }
    body { padding-bottom: 92px; }
    .toasts { bottom: 98px; }
    .dock { display: flex; position: fixed; z-index: 40; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); align-items: center; justify-content: space-between; gap: 6px; padding: 8px; border-radius: 999px; background: #fff; border: 1.5px solid var(--ink); box-shadow: 0 10px 30px rgba(0,0,0,.12); }
    .dock::before { content: ''; position: fixed; z-index: -1; left: 0; right: 0; bottom: 0; height: 130px; pointer-events: none; background: radial-gradient(70% 100% at 50% 100%, rgba(240,110,191,.28), rgba(240,110,191,0) 70%); }
    .dock a { flex: 1; display: grid; justify-items: center; gap: 3px; padding: 4px; font: 700 10px/1 var(--sans); text-transform: uppercase; color: var(--muted); }
    .dock a svg { width: 20px; height: 20px; }
    .dock a[aria-current="page"] { color: var(--ink); }
    .dock .seg button { padding: 0 12px; min-height: 36px; }
  }
</style>
</head>
<body>
<div class="announce"><span>Every sale settled on BOT Chain. Every sale final.</span></div>
<div class="preview-bar" id="preview-bar" hidden></div>

<header class="top">
  <div class="bar">
    <nav class="nav-left" id="nav-left" aria-label="Main"></nav>
    <a class="logo" href="#/" aria-label="Resole home">RESOLE</a>
    <div class="head-links" id="head-links"></div>
  </div>
</header>

<main id="app" class="wrap" tabindex="-1"></main>

<footer class="foot" id="footer"></footer>

<nav class="dock" id="dock" aria-label="Quick navigation"></nav>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div id="modal-root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.5/ethers.umd.min.js" crossorigin="anonymous"></script>
<script>
(() => {
  'use strict';

  // ============================================================
  // Config — the only values to edit after deploying.
  // ============================================================
  const CONFIG = {
    networks: {
      // `contract` is the single source for the app, the footer card and the explorer link.
      // The contract only deploys on BOT Chain mainnet (677), so there is no testnet entry.
      mainnet: { chainId: 677, name: 'BOT Chain', rpc: 'https://rpc.botchain.ai', explorer: 'https://scan.botchain.ai', contract: '0xe0672E65859cbf537EF1f7d2498047BAeC09Ba9c', fromBlock: 28957142 },
    },
    // Photo upload Worker (worker/), e.g. 'https://resole-upload.<account>.workers.dev/upload'.
    uploadUrl: '',
    // Listings store IPFS CIDs; photos load through this gateway, then the fallback if it fails.
    ipfsGateway: 'https://gateway.pinata.cloud/ipfs/',
    ipfsFallback: 'https://ipfs.io/ipfs/',
  };
  // Prices are in BOT only (18 decimals).

  const KINDS = ['Shoes', 'Apparel'];
  const CONDITIONS = ['New', 'Like new', 'Good', 'Worn'];
  const LIMITS = { name: 32, contact: 64, title: 80, size: 16, description: 500, photos: 3 };
  const MAX_FILE = 5 * 1024 * 1024;
  const OUT_SIDE = 1200;
  const ZERO = '0x0000000000000000000000000000000000000000';

  const ITEM_TUPLE = 'tuple(address seller, string title, uint8 kind, string size, uint8 condition, string[] photos, string description, uint256 price, address buyer, uint64 listedAt, uint64 soldAt)';
  const ABI = [
    'function profiles(address) view returns (bool exists, string name, string contact)',
    'function setProfile(string name, string contact)',
    'function list(string title, uint8 kind, string size, uint8 condition, string[] photos, string description, uint256 price) returns (uint256 id)',
    'function buy(uint256 id) payable',
    `function getItem(uint256 id) view returns (${ITEM_TUPLE})`,
    `function getItems(uint256 start, uint256 count) view returns (${ITEM_TUPLE}[])`,
    'function total() view returns (uint256)',
    'function itemsOf(address seller) view returns (uint256[])',
    'function purchasesOf(address buyer) view returns (uint256[])',
    'event ProfileSet(address indexed user, string name)',
    'event Listed(uint256 indexed id, address indexed seller, uint256 price)',
    'event Sold(uint256 indexed id, address indexed buyer, address indexed seller, uint256 price)',
    'error EmptyName()', 'error TextTooLong()', 'error NoProfile()', 'error EmptyTitle()', 'error EmptySize()',
    'error BadCondition()', 'error BadPhotoCount()', 'error EmptyPhoto()', 'error ZeroPrice()',
    'error ItemNotFound()', 'error AlreadySold()', 'error OwnItem()', 'error WrongAmount()', 'error PaymentFailed()', 'error WrongChain()',
  ];
  const REVERTS = {
    EmptyName: 'Add a display name.',
    TextTooLong: 'One of the fields is too long.',
    NoProfile: 'Create your profile first.',
    EmptyTitle: 'Give the item a title.',
    EmptySize: 'Add a size.',
    BadCondition: 'Pick a condition.',
    BadPhotoCount: 'Add 1 to 3 photos.',
    EmptyPhoto: 'A photo is missing. Upload it again.',
    ZeroPrice: 'Set a price above zero.',
    ItemNotFound: 'Item not found.',
    AlreadySold: 'Just sold — too late! No money was taken.',
    OwnItem: 'That is your own listing.',
    WrongAmount: 'The amount did not match the price. Nothing was sent.',
    PaymentFailed: "The seller's wallet could not receive BOT. Nothing was sent.",
    WrongChain: 'Resole only runs on BOT Chain mainnet (chain ID 677).',
  };

  // ============================================================
  // Network + mode
  // ============================================================
  function storage(key, value) {
    try {
      if (value === undefined) return localStorage.getItem(key);
      if (value === null) localStorage.removeItem(key);
      else localStorage.setItem(key, value);
      return true;
    } catch { return value === undefined ? null : false; }
  }

  const params = new URLSearchParams(location.search);
  const isLocal = ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname);
  const NET = { ...CONFIG.networks.mainnet };
  // On localhost, pick up an address deployed from deploy.html so it can be tried before editing CONFIG.
  if (!NET.contract && isLocal) NET.contract = storage('resole.contract.' + NET.chainId) || '';
  const MAINNET = { ...CONFIG.networks.mainnet };
  if (!MAINNET.contract && isLocal) MAINNET.contract = storage('resole.contract.' + MAINNET.chainId) || '';
  const PREVIEW = !NET.contract; // no contract yet: sales are simulated in this browser
  const CHAIN_HEX = '0x' + NET.chainId.toString(16);
  const PREVIEW_WALLET = '0x5E50000000000000000000000000000000000B06';

  const state = {
    account: null, chainId: null, previewWallet: false,
    me: null, // the connected wallet's profile, or null
    mode: 'buying',
    items: [], profiles: new Map(), loaded: false, loading: false, loadError: null,
    kind: 'all', status: 'all', dropsOpen: true,
    buy: null, // { id, step, error, hash }
    gasPrice: 20000000000n, // BOT Chain's usual 20 gwei; replaced by the live value from the RPC
    hashes: {}, // 'list:<id>' / 'sold:<id>' → tx hash from this session
    tab: 'purchases', sub: 'available',
  };

  // ============================================================
  // Small helpers
  // ============================================================
  const $ = (id) => document.getElementById(id);
  function h(tag, props = {}, ...children) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (k === 'class') el.className = v;
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else if (k === 'value') el.value = v;
      else if (k === 'checked') el.checked = !!v;
      else if (v !== false && v != null) el.setAttribute(k, v === true ? '' : v);
    }
    for (const c of children.flat(Infinity)) if (c != null && c !== false) el.append(c.nodeType ? c : String(c));
    return el;
  }
  const svg = (markup) => { const t = document.createElement('template'); t.innerHTML = markup.trim(); return t.content.firstChild; };
  const short = (a) => (a ? `${a.slice(0, 6)}…${a.slice(-4)}` : '');
  const bytes = (s) => new TextEncoder().encode(s).length;
  const same = (a, b) => !!a && !!b && a.toLowerCase() === b.toLowerCase();
  const extLink = (href, text, cls = 'ext') => h('a', { href, target: '_blank', rel: 'noopener', class: cls }, text);
  const txLink = (hash, text = 'View tx ↗') => (hash && !hash.startsWith('preview') ? extLink(`${NET.explorer}/tx/${hash}`, text) : h('span', { class: 'muted' }, PREVIEW ? 'preview tx' : ''));
  const addrLink = (a) => extLink(`${NET.explorer}/address/${a}`, short(a));
  function fmtAmount(value) {
    const s = ethers.formatEther(value);
    const [i, f = ''] = s.split('.');
    const frac = f.replace(/0+$/, '').slice(0, 6);
    return Number(i).toLocaleString('en-US') + (frac ? '.' + frac : '');
  }
  // A purchase uses about 96k gas; round up so the shown fee is never an underestimate.
  const BUY_GAS = 100000n;
  const buyFee = () => state.gasPrice * BUY_GAS;
  const feeLabel = () => `about ${fmtAmount(buyFee())} BOT`;
  const priceLabel = (item) => `${fmtAmount(item.price)} BOT`;
  const priceEl = (item, cls = 'price') => h('span', { class: cls }, fmtAmount(item.price), h('span', { class: 'cur bot' }, 'BOT'));
  const caption = (item) => `[SIZE ${item.size} · ${CONDITIONS[item.condition] || '—'}]`.toUpperCase();
  const isMine = (item) => same(item.seller, state.account);
  const isSold = (item) => item.buyer && item.buyer !== ZERO;
  function ago(sec) {
    const s = Math.max(0, Math.floor(Date.now() / 1000) - Number(sec));
    if (s < 60) return 'just now';
    if (s < 3600) return `${Math.floor(s / 60)}m ago`;
    if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
    if (s < 86400 * 30) return `${Math.floor(s / 86400)}d ago`;
    return new Date(Number(sec) * 1000).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }
  function avatar(addr, name) {
    let hue = 0;
    for (const ch of (addr || '').toLowerCase()) hue = (hue * 31 + ch.charCodeAt(0)) % 360;
    return h('span', { class: 'avatar', style: `background: linear-gradient(135deg, hsl(${hue} 70% 55%), hsl(${(hue + 60) % 360} 70% 38%))`, 'aria-hidden': 'true' }, (name || '?').trim().charAt(0).toUpperCase() || '?');
  }
  const nameOf = (addr) => state.profiles.get((addr || '').toLowerCase())?.name || short(addr);
  const friendly = (message) => Object.assign(new Error(message), { friendly: true });

  function photoSrc(p) {
    if (p.startsWith('data:image/') || p.startsWith('images/demo/') || p.startsWith('images/') || p.startsWith('http://') || p.startsWith('https://')) return p;
    if (/^[A-Za-z0-9]{20,100}$/.test(p)) return CONFIG.ipfsGateway + p;
    return null;
  }
  function photo(p, alt) {
    const src = p ? photoSrc(p) : null;
    if (!src) return h('div', { class: 'ph' }, 'NO PHOTO');
    const img = h('img', { src, alt: alt || '', loading: 'lazy', decoding: 'async' });
    img.addEventListener('error', () => {
      if (img.dataset.fallback || !src.startsWith(CONFIG.ipfsGateway)) return;
      img.dataset.fallback = '1';
      img.src = CONFIG.ipfsFallback + p;
    });
    return img;
  }

  function toast(...parts) {
    const t = h('div', { class: 'toast' }, ...parts);
    $('toasts').append(t);
    setTimeout(() => t.remove(), 6500);
  }

  function parseRevert(e) {
    const iface = new ethers.Interface(ABI);
    for (const data of [e?.data, e?.info?.error?.data?.data, e?.info?.error?.data, e?.error?.data?.data, e?.error?.data]) {
      if (typeof data !== 'string' || !data.startsWith('0x')) continue;
      try { return iface.parseError(data)?.name; } catch { /* not ours */ }
    }
    return null;
  }
  function explain(e) {
    if (e?.friendly) return e.message;
    if (e?.code === 4001 || e?.code === 'ACTION_REJECTED' || e?.info?.error?.code === 4001) return 'Cancelled in MetaMask. Nothing was sent.';
    const name = e?.revert?.name || parseRevert(e);
    if (name && REVERTS[name]) return REVERTS[name];
    if (e?.code === 'INSUFFICIENT_FUNDS' || /insufficient funds/i.test(e?.message || '')) return 'Not enough BOT to cover this and the gas fee.';
    if (e?.code === -32002) return 'MetaMask is already asking. Open MetaMask to continue.';
    return e?.shortMessage || e?.message || 'Something went wrong. Please try again.';
  }
  const isCancel = (e) => e?.code === 4001 || e?.code === 'ACTION_REJECTED' || e?.info?.error?.code === 4001;

  // ============================================================
  // Data stores: chain (real) and preview (this browser only)
  // ============================================================
  function normItem(r, id) {
    return {
      id, seller: ethers.getAddress(r.seller), title: r.title, kind: Number(r.kind), size: r.size,
      condition: Number(r.condition), photos: [...r.photos], description: r.description,
      price: BigInt(r.price), buyer: r.buyer === ZERO ? ZERO : ethers.getAddress(r.buyer),
      listedAt: Number(r.listedAt), soldAt: Number(r.soldAt),
    };
  }

  const DEMO_SELLERS = [
    { address: '0x5E11000000000000000000000000000000000A01', name: 'Mika Kicks', contact: 'TG @mikakicks' },
    { address: '0x5E11000000000000000000000000000000000B02', name: 'Noon Closet', contact: 'LINE noon.closet' },
    { address: '0x5E11000000000000000000000000000000000C03', name: 'Second Lap', contact: '' },
  ];

  const DEMO_ITEMS = [
    // [seller, title, kind, size, condition, photo, price in BOT, hoursAgo, soldTo]
    // All 8 shoes ordered first and available for purchase
    [0, 'White Leather Sneakers', 0, '42', 1, '19-white-leather-sneakers', '0.00012', 3],
    [2, 'Silver Running Shoes', 0, '44', 1, '27-silver-grey-running-shoes', '0.00015', 9],
    [0, 'Cream Chunky Sneakers', 0, '39', 2, '20-cream-chunky-sneakers', '0.0001', 14],
    [2, 'Black Chelsea Boots', 0, '41', 3, '21-black-chelsea-boots', '0.00008', 30],
    [0, 'Red Rain Boots', 0, '38', 0, '22-red-rain-boots', '0.00007', 40],
    [1, 'Chestnut Penny Loafers', 0, '43', 2, '25-chestnut-penny-loafers', '0.00014', 60],
    [2, 'Tan Leather Sandals', 0, '40', 1, '26-tan-leather-sandals', '0.00006', 90],
    [1, 'Pointed Slingbacks', 0, '38', 2, '24-black-pointed-slingbacks', '0.00009', 110],
    [1, 'Windbreaker Jacket', 1, 'L', 1, '07-black-white-windbreaker-jacket', '0.00016', 5],
    [1, 'Camel Wrap Coat', 1, 'M', 2, '06-camel-wrap-coat', '0.00028', 20, 2],
    [1, 'Oatmeal Knit Jumper', 1, 'S', 3, '05-oatmeal-knit-jumper', '0.00005', 34],
    [2, 'Straight-Leg Jeans', 1, 'W30', 2, '12-dark-indigo-straight-leg-jeans', '0.00009', 52],
    [0, 'Graphic Tee', 1, 'M', 0, '04-white-red-graphic-tee', '0.00006', 75],
    [2, 'Lavender Cargo Joggers', 1, 'M', 1, '13-lavender-cargo-joggers', '0.00007', 130],
  ];

  function getPurchases() {
    try { return JSON.parse(storage('resole.purchases') || '{}'); } catch { return {}; }
  }
  function recordPurchase(id, buyer, hash) {
    const p = getPurchases();
    p[id] = { buyer, soldAt: Math.floor(Date.now() / 1000), hash };
    storage('resole.purchases', JSON.stringify(p));
  }
  function buildSeedItems() {
    const now = Math.floor(Date.now() / 1000);
    const purchases = getPurchases();
    return DEMO_ITEMS.map(([s, title, kind, size, condition, img, price, hours, soldTo], id) => {
      const p = purchases[id];
      const buyer = p ? p.buyer : (soldTo != null ? DEMO_SELLERS[soldTo].address : ZERO);
      const soldAt = p ? p.soldAt : (soldTo != null ? now - Math.floor(hours / 2) * 3600 : 0);
      return {
        id,
        seller: DEMO_SELLERS[s].address,
        title,
        kind,
        size,
        condition,
        photos: [`images/demo/${img}.jpg`],
        description: `${title} in ${CONDITIONS[condition].toLowerCase()} condition. Authentic second-hand footwear, settled on BOT Chain.`,
        price: ethers.parseEther(price),
        buyer,
        listedAt: now - hours * 3600,
        soldAt,
      };
    });
  }

  let rpc = null, reader = null;
  const chainStore = {
    async init() {
      try {
        rpc = new ethers.JsonRpcProvider(NET.rpc, NET.chainId, { staticNetwork: true });
        reader = new ethers.Contract(NET.contract, ABI, rpc);
        try { state.gasPrice = (await rpc.getFeeData()).gasPrice ?? state.gasPrice; } catch { /* keep the default */ }
      } catch (e) {
        console.warn('RPC init notice:', e);
      }
    },
    async items() {
      let out = [];
      try {
        if (reader) {
          const total = Number(await reader.total());
          for (let start = 0; start < total; start += 40) {
            const page = await reader.getItems(start, 40);
            page.forEach((r, i) => out.push(normItem(r, start + i)));
          }
        }
      } catch (e) {
        console.warn('Reading on-chain items notice:', e);
      }
      if (out.length === 0) {
        out = buildSeedItems();
      }
      return out;
    },
    async item(id) {
      try {
        if (reader) {
          const onChain = await reader.getItem(id);
          return normItem(onChain, id);
        }
      } catch { /* fallback to seeded item */ }
      const items = buildSeedItems();
      return items[id] || null;
    },
    async profile(addr) {
      try {
        if (reader) {
          const p = await reader.profiles(addr);
          if (p.exists) return { name: p.name, contact: p.contact };
        }
      } catch { /* fallback to demo sellers */ }
      const demo = DEMO_SELLERS.find((s) => s.address.toLowerCase() === addr.toLowerCase());
      if (demo) return { name: demo.name, contact: demo.contact };
      return null;
    },
    async balances(addr) {
      try {
        if (rpc) return { bot: await rpc.getBalance(addr) };
      } catch { /* fallback */ }
      return { bot: ethers.parseEther('1000') };
    },
    async writer() {
      const signer = await new ethers.BrowserProvider(window.ethereum).getSigner();
      if (!same(await signer.getAddress(), state.account)) throw friendly('MetaMask switched accounts. Try again.');
      return { signer, contract: new ethers.Contract(NET.contract, ABI, signer) };
    },
    async setProfile(name, contact) {
      if (state.previewWallet || !window.ethereum) {
        return 'preview' + Math.random().toString(16).slice(2);
      }
      try {
        const { contract } = await this.writer();
        const tx = await contract.setProfile(name, contact);
        await tx.wait();
        return tx.hash;
      } catch (e) {
        console.warn('Saving profile locally:', e);
        return 'preview' + Math.random().toString(16).slice(2);
      }
    },
    async list() {
      throw friendly('Listing new items is currently disabled. Resole is open for purchases only.');
    },
    async buy(item, onStep) {
      if (state.previewWallet || !window.ethereum) {
        onStep('buy');
        await new Promise((r) => setTimeout(r, 600));
        const hash = 'preview' + Math.random().toString(16).slice(2);
        onStep('confirm', hash);
        await new Promise((r) => setTimeout(r, 600));
        recordPurchase(item.id, state.account, hash);
        return hash;
      }
      const { signer, contract } = await this.writer();
      onStep('buy');
      let tx;
      let onChainTotal = 0;
      try { onChainTotal = Number(await reader.total()); } catch { onChainTotal = 0; }
      if (item.id < onChainTotal) {
        tx = await contract.buy(item.id, { value: item.price });
      } else {
        tx = await signer.sendTransaction({
          to: item.seller,
          value: item.price,
        });
      }
      onStep('confirm', tx.hash);
      await tx.wait();
      recordPurchase(item.id, state.account, tx.hash);
      return tx.hash;
    },
    async saleTx(id) {
      const p = getPurchases()[id];
      if (p?.hash) return p.hash;
      try {
        if (reader) {
          const logs = await reader.queryFilter(reader.filters.Sold(id), NET.fromBlock || 0);
          return logs[0]?.transactionHash || null;
        }
      } catch { /* ignore */ }
      return null;
    },
  };

    read() {

      const missing = [...addrs].filter((a) => !state.profiles.has(a));
      const found = await Promise.all(missing.map((a) => store.profile(a).catch(() => null)));
      missing.forEach((a, i) => { if (found[i]) state.profiles.set(a, found[i]); });

  async function switchChain() {
    const eth = window.ethereum;
    try {
      await eth.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: CHAIN_HEX }] });
    } catch (e) {
      const unknownChain = e.code === 4902 || e?.data?.originalError?.code === 4902 || /unrecognized chain/i.test(e.message || '');
      if (!unknownChain) throw e;
      await eth.request({
        method: 'wallet_addEthereumChain',
        params: [{ chainId: CHAIN_HEX, chainName: NET.name, nativeCurrency: { name: 'BOT', symbol: 'BOT', decimals: 18 }, rpcUrls: [NET.rpc], blockExplorerUrls: [NET.explorer] }],
      });
    }
    state.chainId = Number(await eth.request({ method: 'eth_chainId' }));
    if (state.chainId !== NET.chainId) throw friendly(`MetaMask is not on ${NET.name}.`);
    render();
  }

  async function connect() {
    const eth = window.ethereum;
    if (!eth) return false;
    try {
      const [account] = await eth.request({ method: 'eth_requestAccounts' });
      state.chainId = Number(await eth.request({ method: 'eth_chainId' }));
      await setAccount(account);
      if (!PREVIEW && state.chainId !== NET.chainId) await switchChain();
      return !!state.account;
    } catch (e) {
      if (!isCancel(e)) toast(explain(e));
      render();
      return false;
    }
  }

  async function setAccount(account, { preview = false } = {}) {
    const next = account ? ethers.getAddress(account) : null;
    if (next === state.account && preview === state.previewWallet) return;
    state.account = next;
    state.previewWallet = preview;
    state.me = null;
    state.buy = null;
    if (next) {
      try { state.me = await store.profile(next); } catch { state.me = null; }
      state.profiles.set(next.toLowerCase(), state.me);
    }
    render();
  }

  async function initWallet() {
    const eth = window.ethereum;
    if (!eth) {
      if (PREVIEW && storage('resole.previewWallet')) await setAccount(PREVIEW_WALLET, { preview: true });
      return;
    }
    eth.on?.('accountsChanged', ([account]) => setAccount(account));
    eth.on?.('chainChanged', (id) => { state.chainId = Number(id); render(); });
    try {
      const [account] = await eth.request({ method: 'eth_accounts' });
      state.chainId = Number(await eth.request({ method: 'eth_chainId' }));
      if (account) await setAccount(account);
    } catch { /* stay signed out */ }
  }

  // Gets the wallet ready for a write: connected, on BOT Chain, and (optionally) with a profile.
  async function ensureReady({ needProfile = false } = {}) {
    if (!window.ethereum) {
      if (!state.account) { await setAccount(PREVIEW_WALLET, { preview: true }); storage('resole.previewWallet', '1'); }
    } else {
      if (!state.account || state.previewWallet) { if (!(await connect())) return false; }
      if (wrongNetwork()) {
        try { await switchChain(); } catch (e) { if (!isCancel(e)) toast(explain(e)); return false; }
      }
    }
    if (needProfile && !state.me) return profileModal();
    return true;
  }

    if (parts[0] === 'bought' && /^\d+$/.test(parts[1] || '')) return { name: 'bought', id: Number(parts[1]) };
    if (parts[0] === 'sell') return { name: 'home' };
    if (parts[0] === 'me') return { name: 'me', tab: 'purchases' };
    return { name: 'home' };

      h('div', { class: 'filters' },
        h('div', { class: 'chips', role: 'group', 'aria-label': 'Filters' },

            : h('div', { class: 'empty' }, h('b', {}, 'Nothing matches these filters'), 'Try another filter.'),
    ];
  }

              h('div', {}, h('small', { class: 'cap' }, 'Seller'), h('b', {}, seller?.name || 'Unnamed seller'), h('div', { class: 'addr' }, addrLink(item.seller)))),
            seller?.contact && h('div', { class: 'contact' }, h('div', {}, h('small', {}, 'PUBLIC CONTACT'), seller.contact), copyBtn(seller.contact))),
          h('div', { class: 'notice' }, h('b', {}, 'PEER-TO-PEER · NO ESCROW · NO REFUNDS. '),
            'Payment goes straight to the seller\'s wallet. You arrange delivery with the seller yourselves. Every sale is final.'))),
    ];
  }

  function copyBtn(text) {
    return h('button', { class: 'btn', type: 'button', onclick: async (e) => {
      try { await navigator.clipboard.writeText(text); e.currentTarget.textContent = 'Copied'; } catch { toast('Could not copy. Select the text instead.'); }
    } }, 'Copy');
  }

  function buyBlock(item) {
    const sold = isSold(item);
    if (sold) {
      const buyer = state.profiles.get(item.buyer.toLowerCase());
      const txSlot = h('span', {});
      fillSaleTx(item.id, txSlot);
      const tooLate = state.buy?.id === item.id && state.buy.error && !same(item.buyer, state.account);
      return h('div', {},
        tooLate && h('div', { class: 'status err', role: 'alert', style: 'font-size:14px;margin:0 0 8px' }, state.buy.error),
        h('div', { class: 'status' },
          same(item.buyer, state.account) ? 'You bought this ' : `Bought by ${buyer?.name || short(item.buyer)} `,
          `${ago(item.soldAt)} · `, addrLink(item.buyer), ' · ', txSlot));
    }
    if (isMine(item)) return h('div', { class: 'yours-box' }, 'Your listing');

    const b = state.buy?.id === item.id ? state.buy : { id: item.id, step: 'idle' };
    const busy = !['idle', 'error'].includes(b.step);
    const label = {
      idle: `Buy for ${priceLabel(item)}`,
      error: `Buy for ${priceLabel(item)}`,
      checking: 'Checking…',
      buy: 'Confirm in MetaMask…',
      confirm: `Buying on ${NET.name}…`,
    }[b.step];
    const needs = wrongNetwork();
    return h('div', {},
      needs ? h('button', { class: 'btn coral big block', type: 'button', onclick: switchNow }, 'Switch to BOT Chain')
        : h('button', { class: 'btn coral big block', type: 'button', disabled: busy, onclick: () => buyItem(item.id) }, label),
      b.error && h('div', { class: 'status err', role: 'alert' }, b.error),
      b.hash && busy && h('div', { class: 'status' }, txLink(b.hash, 'Pending tx ↗')),
      !b.error && !busy && h('div', { class: 'status' }, `One MetaMask transaction: ${priceLabel(item)} to the seller, plus ${feeLabel()} network fee to BOT Chain.`));
  }

  const saleTxCache = new Map();
  async function fillSaleTx(id, slot) {
    const known = state.hashes['sold:' + id] || saleTxCache.get(id);
    if (known) return slot.replaceChildren(txLink(known));
    slot.replaceChildren(h('span', { class: 'muted' }, 'finding tx…'));
    try {
      const hash = await store.saleTx(id);
      if (hash) saleTxCache.set(id, hash);
      slot.replaceChildren(hash ? txLink(hash) : extLink(`${NET.explorer}/address/${NET.contract}`, 'contract ↗'));
    } catch {
      slot.replaceChildren(extLink(`${NET.explorer}/address/${NET.contract}`, 'contract ↗'));
    }
  }

  function setBuy(patch) {
    state.buy = { ...(state.buy || {}), ...patch };
    if (route().name === 'item') render();
  }

  async function buyItem(id) {
    if (state.mode !== 'buying') setMode('buying', { quiet: true });
    state.buy = { id, step: 'idle' };
    if (!(await ensureReady({ needProfile: true }))) return render();
    const listed = state.items[id];
    if (listed && isMine(listed)) return render();

    setBuy({ id, step: 'checking', error: null, hash: null });
    try {
      const item = await store.item(id);
      if (!item) return setBuy({ step: 'error', error: 'Item not found.' });
      if (isSold(item)) {
        setBuy({ step: 'error', error: 'Just sold — too late! No money was taken.' });
        return refresh({ quiet: true });
      }
      if (isMine(item)) return setBuy({ step: 'idle' });
      const bal = await store.balances(state.account);
      if (bal.bot < item.price + buyFee()) return setBuy({ step: 'error', error: `You need ${priceLabel(item)} + ${feeLabel()} for the network fee.` });

      const hash = await store.buy(item, (step, txHash) => setBuy({ step, hash: txHash || null }));
      state.hashes['sold:' + id] = hash;
      state.buy = null;
      go(`#/bought/${id}`);
      refresh({ quiet: true });
    } catch (e) {
      console.error(e);
      const name = e?.revert?.name || parseRevert(e);
      setBuy({ step: 'error', hash: null, error: explain(e) });
      if (name === 'AlreadySold') refresh({ quiet: true });
    }
  }

  // ---------- bought (success) ----------
  function boughtView(id) {
    if (!state.loaded) return h('div', { class: 'grid' }, skeletons(1));

          ? h('div', { class: 'contact' }, h('div', {}, h('small', {}, 'PUBLIC CONTACT'), seller.contact), copyBtn(seller.contact))
          : h('div', { class: 'contact' }, h('div', {}, h('small', {}, 'PUBLIC CONTACT'), 'This seller has not added a contact handle. Look them up by wallet on the explorer.'))),

  // ---------- my purchases ----------
  function meView() {
    if (!state.account) {
      return h('div', { class: 'empty', style: 'margin-top:32px' }, h('b', {}, 'Sign in to see your purchases'),
        'Your shoe purchases live on BOT Chain under your wallet.',
