  // ---------- sell ----------
  const draft = {
    photos: [], // { blob, url, cid, error, uploading }
    title: '', kind: 0, size: '', condition: 1, description: '', price: '',
    stage: 'form', // form → confirm → working
    agreed: false, errors: {}, progress: null,
  };
  function resetDraft() {
    draft.photos.forEach((p) => URL.revokeObjectURL(p.url));
    Object.assign(draft, { photos: [], title: '', kind: 0, size: '', condition: 1, description: '', price: '', stage: 'form', agreed: false, errors: {}, progress: null });
  }

  function validateDraft() {
    const e = {};
    draft.photoError = null;
    if (!draft.photos.length) e.photos = 'Add at least one photo.';
    if (!draft.title.trim()) e.title = 'Give it a title.';
    else if (bytes(draft.title.trim()) > LIMITS.title) e.title = `Keep it under ${LIMITS.title} characters.`;
    if (!draft.size.trim()) e.size = 'Add a size, e.g. 42, US 9 or M.';
    else if (bytes(draft.size.trim()) > LIMITS.size) e.size = `Keep it under ${LIMITS.size} characters.`;
    if (bytes(draft.description) > LIMITS.description) e.description = `Keep it under ${LIMITS.description} characters.`;
    const dec = 18;
    const m = /^(\d+)(?:\.(\d+))?$/.exec(draft.price.trim());
    if (!m) e.price = 'Enter a price, e.g. 25 or 12.5.';
    else if ((m[2] || '').length > dec) e.price = `Use at most ${dec} decimals.`;
    else if (ethers.parseEther(draft.price.trim()) === 0n) e.price = 'Set a price above zero.';
    draft.errors = e;
    return !Object.keys(e).length;
  }
  const draftPrice = () => ethers.parseEther(draft.price.trim());

  function sellView() {
    if (!state.account || !state.me) {
      return h('div', { class: 'empty', style: 'margin-top:32px' }, h('b', {}, 'Sign in to sell'),
        'You need a wallet and a profile (display name + optional contact) to list an item.',
        h('div', {}, h('button', { class: 'btn coral', type: 'button', onclick: async () => { if (await ensureReady({ needProfile: true })) render(); } }, 'Sign in')));
    }
    if (!PREVIEW && !CONFIG.uploadUrl) {
      return h('div', { class: 'empty', style: 'margin-top:32px' }, h('b', {}, 'Photo uploads are not set up yet'), 'The site owner needs to add the upload Worker URL before items can be listed.');
    }
    if (draft.stage !== 'form') return confirmView();

    const err = (k) => draft.errors[k] && h('div', { class: 'err-text', role: 'alert' }, draft.errors[k]);
    const field = (key, label, max, props = {}) => {
      const counter = h('span', {}, `${bytes(draft[key])}/${max}`);
      const input = h(props.multiline ? 'textarea' : 'input', {
        type: props.multiline ? null : 'text', value: draft[key], placeholder: props.placeholder || '', maxlength: max, autocomplete: 'off', inputmode: props.inputmode || null,
        oninput: (e) => { draft[key] = e.target.value; counter.textContent = `${bytes(draft[key])}/${max}`; updatePreview(); },
      });
      return h('label', { class: 'f' }, h('span', {}, label, max && counter), input, err(key));
    };
    const opts = (key, labels) => h('div', { class: 'opts', role: 'group' }, labels.map((l, i) => h('button', {
      type: 'button', class: 'chip-btn', 'aria-pressed': String(draft[key] === i), onclick: () => { draft[key] = i; render(); },
    }, l)));

    const fileInput = h('input', { type: 'file', accept: 'image/jpeg,image/png,image/webp', hidden: true, onchange: (e) => { const f = e.target.files[0]; e.target.value = ''; if (f) addPhoto(f); } });
    const slots = Array.from({ length: LIMITS.photos }, (_, i) => {
      const p = draft.photos[i];
      if (p) {
        return h('div', { class: 'slot' }, h('img', { src: p.url, alt: `Photo ${i + 1}` }),
          i === 0 && h('span', { class: 'cover' }, 'COVER'),
          h('button', { class: 'x', type: 'button', 'aria-label': `Remove photo ${i + 1}`, onclick: () => { URL.revokeObjectURL(p.url); draft.photos.splice(i, 1); render(); } }, '×'));
      }
      if (i === draft.photos.length) return h('button', { class: 'slot', type: 'button', onclick: () => fileInput.click() }, i === 0 ? '+ Add photo\nJPG · PNG · WebP' : '+ Add');
      return h('div', { class: 'slot', 'aria-hidden': 'true', style: 'cursor:default;opacity:.4' });
    });

    const previewSlot = h('div', {});
    function updatePreview() {
      let price = 0n;
      try { price = /^\d+(\.\d+)?$/.test(draft.price.trim()) ? draftPrice() : 0n; } catch { price = 0n; }
      const fake = {
        id: -1, seller: state.account, title: draft.title.trim() || 'Your item title', kind: draft.kind, size: draft.size.trim() || '—',
        condition: draft.condition, photos: [], price, buyer: ZERO, listedAt: Date.now() / 1000,
      };
      const c = card(fake);
      c.removeAttribute('href');
      const media = c.querySelector('.media');
      media.querySelector('img, .ph')?.replaceWith(draft.photos[0] ? h('img', { src: draft.photos[0].url, alt: '' }) : h('div', { class: 'ph' }, 'COVER PHOTO'));
      previewSlot.replaceChildren(c);
    }
    updatePreview();

    return [
      h('a', { class: 'back', href: '#/' }, '← Back to shop'),
      h('h1', { class: 'page-title' }, 'Sell an item'),
      h('p', { class: 'muted', style: 'margin:0 0 24px' }, 'You set the price in BOT. Buyers pay you directly. No platform fee.'),
      h('div', { class: 'sell' },
        h('form', { class: 'form', novalidate: true, onsubmit: (e) => { e.preventDefault(); if (validateDraft()) { draft.stage = 'confirm'; draft.agreed = false; } render(); window.scrollTo({ top: 0 }); } },
          h('div', { class: 'f' }, h('span', { class: 'lbl' }, 'Photos (1–3)', h('span', {}, `${draft.photos.length}/3`)), h('div', { class: 'photos' }, slots), fileInput,
            draft.photoError && h('div', { class: 'err-text', role: 'alert' }, draft.photoError), err('photos'),
            h('div', { class: 'cap' }, 'Square crop · max 5 MB each · location data is removed')),
          field('title', 'Title', LIMITS.title, { placeholder: 'e.g. White leather sneakers' }),
          h('div', { class: 'f' }, h('span', { class: 'lbl' }, 'Type'), opts('kind', KINDS)),
          field('size', 'Size', LIMITS.size, { placeholder: 'e.g. 42, US 9, M' }),
          h('div', { class: 'f' }, h('span', { class: 'lbl' }, 'Condition'), opts('condition', CONDITIONS)),
          field('description', 'Description (optional)', LIMITS.description, { multiline: true, placeholder: 'Fit, flaws, how often worn, what is included…' }),
          h('div', { class: 'f' }, h('span', { class: 'lbl' }, 'Your price'),
            h('div', { class: 'price-row' },
              h('input', { type: 'text', inputmode: 'decimal', value: draft.price, placeholder: 'e.g. 0.0002', 'aria-label': 'Price in BOT', autocomplete: 'off', oninput: (e) => { draft.price = e.target.value.replace(',', '.'); updatePreview(); } }),
              h('div', { class: 'opts' }, h('span', { class: 'chip-btn', 'aria-pressed': 'true', style: 'display:inline-flex;align-items:center' }, 'BOT'))),
            err('price')),
          h('button', { class: 'btn coral big block', type: 'submit' }, 'Review listing')),
        h('aside', { class: 'preview-card' }, h('div', { class: 'lbl' }, 'Card preview'), previewSlot,
          h('div', { class: 'notice' }, h('b', {}, 'Privacy: '), 'everything here is public forever. Never include your home address or phone number.'))),
    ];
  }

  function confirmView() {
    const working = draft.stage === 'working';
    const p = draft.progress || {};
    const fake = {
      id: -1, seller: state.account, title: draft.title.trim(), kind: draft.kind, size: draft.size.trim(),
      condition: draft.condition, photos: [], price: draftPrice(), buyer: ZERO, listedAt: Date.now() / 1000,
    };
    const c = card(fake);
    c.removeAttribute('href');
    c.querySelector('.media img, .media .ph')?.replaceWith(h('img', { src: draft.photos[0].url, alt: '' }));

    const line = (status, text) => h('div', { class: status }, h('i', { 'aria-hidden': 'true' }, { done: '✓', on: '●', bad: '!', '': '○' }[status]), text);
    const up = p.upload || '';
    const steps = h('div', { class: 'progress', 'aria-live': 'polite' },
      draft.photos.map((ph, i) => line(ph.cid ? 'done' : ph.error ? 'bad' : ph.uploading ? 'on' : '', `Photo ${i + 1}: ${ph.cid ? 'pinned to IPFS' : ph.error ? ph.error : ph.uploading ? 'uploading…' : 'waiting'}`)),
      line(p.chain === 'done' ? 'done' : p.chain ? 'on' : '', p.chain === 'sign' ? 'Confirm in MetaMask…' : p.chain === 'confirm' ? `Listing on ${NET.name}…` : p.chain === 'done' ? 'Listed' : 'List on BOT Chain'),
      p.hash && h('div', {}, h('i', {}, ''), txLink(p.hash, 'Pending tx ↗')));

    return [
      h('button', { class: 'back', type: 'button', style: 'background:none;border:0;cursor:pointer;padding:0', disabled: working, onclick: () => { draft.stage = 'form'; render(); } }, '← Edit listing'),
      h('h1', { class: 'page-title' }, 'Check your listing'),
      h('div', { class: 'sell', style: 'margin-top:20px' },
        h('div', {},
          h('div', { class: 'perm' },
            h('h3', {}, 'This listing is permanent.'),
            h('p', {}, "Once on BOT Chain it can't be edited, removed or re-priced. Photos are pinned to IPFS and stay public."),
            h('label', { class: 'check' }, h('input', { type: 'checkbox', checked: draft.agreed, disabled: working, onchange: (e) => { draft.agreed = e.target.checked; render(); } }),
              h('span', {}, `I understand. List "${draft.title.trim()}" for ${fmtAmount(fake.price)} BOT, forever.`))),
          h('div', { class: 'panel', style: 'margin-top:12px' },
            h('div', { class: 'facts' },
              h('div', {}, h('small', {}, 'Size'), h('b', {}, fake.size)),
              h('div', {}, h('small', {}, 'Condition'), h('b', {}, CONDITIONS[fake.condition])),
              h('div', {}, h('small', {}, 'Type'), h('b', {}, KINDS[fake.kind]))),
            draft.description.trim() && h('p', { class: 'desc' }, draft.description.trim()),
            h('div', { class: 'cap', style: 'margin-top:12px' }, `${draft.photos.length} photo${draft.photos.length > 1 ? 's' : ''} · seller ${state.me?.name}`)),
          up === 'failed' || p.error ? h('div', { class: 'status err', role: 'alert' }, p.error || 'A photo did not upload. Nothing was listed. Try again.') : null,
          (working || p.started) && steps,
          h('button', { class: 'btn coral big block', type: 'button', style: 'margin-top:16px', disabled: !draft.agreed || working, onclick: publish },
            working ? 'Working…' : p.started ? 'Try again' : 'Upload photos & list')),
        h('aside', { class: 'preview-card' }, h('div', { class: 'lbl' }, 'How buyers will see it'), c)),
    ];
  }

  async function uploadPhoto(ph) {
    if (PREVIEW && !CONFIG.uploadUrl) {
      // No Worker in preview: keep a small copy in this browser instead of pinning.
      return shrinkToDataUrl(ph.blob, 560);
    }
    const form = new FormData();
    form.append('file', ph.blob, 'photo.' + (ph.blob.type === 'image/webp' ? 'webp' : 'jpg'));
    let res;
    try { res = await fetch(CONFIG.uploadUrl, { method: 'POST', body: form }); } catch { throw friendly('Network error'); }
    const body = await res.json().catch(() => ({}));
    if (res.ok && body.cid) return body.cid;
    throw friendly({
      bad_type: 'Not a JPG, PNG or WebP', too_large: 'Over 5 MB', too_many_pixels: 'Image too large',
      bad_image: 'Could not read the image', rate_limited: 'Too many uploads, wait a bit', pin_failed: 'IPFS pinning failed',
      origin_not_allowed: 'This site is not allowed to upload', not_configured: 'Upload service not configured',
    }[body.error] || `Upload failed (${res.status})`);
  }

  async function publish() {
    if (!draft.agreed || draft.stage === 'working') return;
    if (!(await ensureReady({ needProfile: true }))) return;
    if (!validateDraft()) { draft.stage = 'form'; return render(); }
    draft.stage = 'working';
    draft.progress = { started: true };
    render();

    // 1) Pin every photo that is not pinned yet. Nothing is listed unless all of them succeed.
    for (const ph of draft.photos) {
      if (ph.cid) continue;
      ph.uploading = true; ph.error = null; render();
      try { ph.cid = await uploadPhoto(ph); } catch (e) { ph.error = e.friendly ? e.message : 'Upload failed'; }
      ph.uploading = false; render();
    }
    if (draft.photos.some((ph) => !ph.cid)) {
      draft.stage = 'confirm';
      draft.progress = { started: true, upload: 'failed' };
      return render();
    }

    // 2) One transaction.
    try {
      const f = {
        title: draft.title.trim(), kind: draft.kind, size: draft.size.trim(), condition: draft.condition,
        photos: draft.photos.map((ph) => ph.cid), description: draft.description.trim(), price: draftPrice(),
      };
      const { hash, id } = await store.list(f, (chain, txHash) => { draft.progress = { ...draft.progress, chain, hash: txHash || draft.progress.hash }; render(); });
      draft.progress.chain = 'done';
      state.hashes['list:' + id] = hash;
      await refresh({ quiet: true });
      go(id != null ? `#/item/${id}` : '#/me');
      resetDraft();
      toast('Listed. It lives on BOT Chain forever. ', txLink(hash));
    } catch (e) {
      console.error(e);
      draft.stage = 'confirm';
      draft.progress = { started: true, error: explain(e) };
      render();
    }
  }

  // ---------- photos: validate → crop to square → resize ----------
  function addPhoto(file) {
    draft.photoError = null;
    if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) { draft.photoError = 'Use a JPG, PNG or WebP photo.'; return render(); }
    if (file.size > MAX_FILE) { draft.photoError = 'That photo is over 5 MB. Pick a smaller one.'; return render(); }
    if (draft.photos.length >= LIMITS.photos) return;
    cropModal(file);
  }

  async function loadBitmap(file) {
    try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch { /* fall back */ }
    const url = URL.createObjectURL(file);
    try {
      const img = new Image();
      img.src = url;
      await img.decode();
      return img;
    } finally { URL.revokeObjectURL(url); }
  }
  function canvasBlob(canvas, type, quality) { return new Promise((r) => canvas.toBlob(r, type, quality)); }
  async function encode(canvas) {
    const webp = await canvasBlob(canvas, 'image/webp', 0.86);
    if (webp && webp.type === 'image/webp') return webp;
    return canvasBlob(canvas, 'image/jpeg', 0.88);
  }
  async function shrinkToDataUrl(blob, side) {
    const bmp = await loadBitmap(blob);
    const c = Object.assign(document.createElement('canvas'), { width: side, height: side });
    c.getContext('2d').drawImage(bmp, 0, 0, side, side);
    return c.toDataURL('image/jpeg', 0.8);
  }

  async function cropModal(file) {
    let bmp;
    try { bmp = await loadBitmap(file); } catch { draft.photoError = 'Could not read that image. Try another photo.'; return render(); }
    const w = bmp.width, hgt = bmp.height;
    const view = h('div', { class: 'crop', 'aria-label': 'Drag to position the photo' });
    const shown = h('canvas', { width: w, height: hgt, style: 'position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none' });
    shown.getContext('2d').drawImage(bmp, 0, 0);
    view.append(shown);
    let zoom = 1, ox = 0, oy = 0, size = 0;
    const base = () => size / Math.min(w, hgt); // scale where the short side fills the square
    function clamp() {
      const s = base() * zoom;
      ox = Math.min(0, Math.max(size - w * s, ox));
      oy = Math.min(0, Math.max(size - hgt * s, oy));
    }
    function draw() { clamp(); shown.style.transform = `translate(${ox}px, ${oy}px) scale(${base() * zoom})`; }
    function center() { const s = base() * zoom; ox = (size - w * s) / 2; oy = (size - hgt * s) / 2; draw(); }
    let drag = null;
    view.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY, ox, oy }; view.setPointerCapture(e.pointerId); view.style.cursor = 'grabbing'; });
    view.addEventListener('pointermove', (e) => { if (!drag) return; ox = drag.ox + e.clientX - drag.x; oy = drag.oy + e.clientY - drag.y; draw(); });
    const end = () => { drag = null; view.style.cursor = ''; };
    view.addEventListener('pointerup', end);
    view.addEventListener('pointercancel', end);
    const slider = h('input', { type: 'range', min: 1, max: 3, step: 0.01, value: 1, 'aria-label': 'Zoom',
      oninput: (e) => {
        const old = base() * zoom;
        zoom = Number(e.target.value);
        const now = base() * zoom;
        const cx = size / 2, cy = size / 2;
        ox = cx - (cx - ox) * (now / old); oy = cy - (cy - oy) * (now / old);
        draw();
      } });

    const close = openModal(h('div', { class: 'modal wide', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Crop photo' },
      h('button', { class: 'x-close', type: 'button', 'aria-label': 'Close', onclick: () => close() }, '×'),
      h('h2', {}, 'Crop to square'),
      h('p', { class: 'muted', style: 'margin:0' }, 'Drag to position. Zoom to frame the item.'),
      view,
      h('div', { class: 'zoom' }, '−', slider, '+'),
      h('div', { class: 'actions' },
        h('button', { class: 'btn', type: 'button', onclick: () => close() }, 'Cancel'),
        h('button', { class: 'btn coral', type: 'button', onclick: async (e) => {
          e.currentTarget.disabled = true;
          const s = base() * zoom;
          const sx = -ox / s, sy = -oy / s, side = size / s;
          const out = Math.round(Math.min(OUT_SIDE, side));
          const c = Object.assign(document.createElement('canvas'), { width: out, height: out });
          const ctx = c.getContext('2d');
          ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(bmp, sx, sy, side, side, 0, 0, out, out);
          const blob = await encode(c);
          if (!blob || blob.size > MAX_FILE) { draft.photoError = 'Could not process that photo. Try another.'; close(); return render(); }
          draft.photos.push({ blob, url: URL.createObjectURL(blob), cid: null, error: null });
          close();
          render();
        } }, 'Use photo'))));
    requestAnimationFrame(() => { size = view.clientWidth; center(); });
  }

  // ============================================================
  // Modals
  // ============================================================
  function openModal(content, onDismiss) {
    const back = h('div', { class: 'modal-back' }, content);
    const prev = document.activeElement;
    let closed = false;
    const close = (dismissed = false) => {
      if (closed) return;
      closed = true;
      back.remove();
      document.removeEventListener('keydown', onKey);
      if (dismissed) onDismiss?.();
      prev?.focus?.();
    };
    const onKey = (e) => { if (e.key === 'Escape' && !back.dataset.busy) close(true); };
    back.addEventListener('mousedown', (e) => { if (e.target === back && !back.dataset.busy) close(true); });
    document.addEventListener('keydown', onKey);
    $('modal-root').append(back);
    (content.querySelector('input, button.btn') || content).focus?.();
    close.el = back;
    return close;
  }

  function installModal() {
    const close = openModal(h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Install MetaMask' },
      h('button', { class: 'x-close', type: 'button', 'aria-label': 'Close', onclick: () => close() }, '×'),
      h('h2', {}, 'Install MetaMask'),
      h('p', { class: 'muted' }, 'Resole uses MetaMask to sign in and pay on BOT Chain. Browsing works without it. On mobile, open this site inside the MetaMask app browser.'),
      h('div', { class: 'actions' }, extLink('https://metamask.io/download/', 'Get MetaMask ↗', 'btn coral'))));
  }

  function profileModal({ editing = false } = {}) {
    return new Promise((resolve) => {
      const values = { name: state.me?.name || '', contact: state.me?.contact || '' };
      const errBox = h('div', { class: 'status err', role: 'alert' });
      const counter = (k, max) => h('span', {}, `${bytes(values[k])}/${max}`);
      const nameCount = counter('name', LIMITS.name), contactCount = counter('contact', LIMITS.contact);
      const save = h('button', { class: 'btn coral', type: 'submit' }, editing ? 'Save profile' : 'Create profile');
      const form = h('form', { class: 'form', style: 'margin-top:16px', onsubmit: async (e) => {
        e.preventDefault();
        const name = values.name.trim(), contact = values.contact.trim();
        if (!name) return errBox.replaceChildren('Add a display name.');
        if (bytes(name) > LIMITS.name || bytes(contact) > LIMITS.contact) return errBox.replaceChildren('One of the fields is too long.');
        if ([name, contact].some((v) => /\d[\d\s().-]{7,}\d/.test(v))) return errBox.replaceChildren('That looks like a phone number. Use a name and a public handle (Telegram, LINE, Instagram) instead.');
        save.disabled = true; close.el.dataset.busy = '1';
        errBox.className = 'status'; errBox.replaceChildren(PREVIEW ? 'Saving…' : 'Confirm in MetaMask…');
        try {
          await store.setProfile(name, contact);
          state.me = { name, contact };
          state.profiles.set(state.account.toLowerCase(), state.me);
          close();
          toast(editing ? 'Profile updated.' : `Welcome to Resole, ${name}.`);
          render();
          resolve(true);
        } catch (err) {
          console.error(err);
          delete close.el.dataset.busy;
          save.disabled = false;
          errBox.className = 'status err';
          errBox.replaceChildren(explain(err));
        }
      } },
        h('label', { class: 'f' }, h('span', {}, 'Display name', nameCount),
          h('input', { type: 'text', value: values.name, maxlength: LIMITS.name, required: true, autocomplete: 'nickname', placeholder: 'e.g. Mika Kicks', oninput: (e) => { values.name = e.target.value; nameCount.textContent = `${bytes(values.name)}/${LIMITS.name}`; } })),
        h('label', { class: 'f' }, h('span', {}, 'Public contact (optional)', contactCount),
          h('input', { type: 'text', value: values.contact, maxlength: LIMITS.contact, autocomplete: 'off', placeholder: 'e.g. TG @mikakicks or LINE mika.k', oninput: (e) => { values.contact = e.target.value; contactCount.textContent = `${bytes(values.contact)}/${LIMITS.contact}`; } })),
        h('div', { class: 'notice', style: 'margin:0' }, h('b', {}, 'Public forever. '), 'Buyers and sellers use this to arrange delivery. Never add a home address or phone number.'),
        errBox,
        h('div', { class: 'actions', style: 'margin-top:0' }, h('button', { class: 'btn', type: 'button', onclick: () => { close(); resolve(false); } }, 'Cancel'), save));
      const close = openModal(h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Profile' },
        h('button', { class: 'x-close', type: 'button', 'aria-label': 'Close', onclick: () => { close(); resolve(false); } }, '×'),
        h('h2', {}, editing ? 'Edit your profile' : 'Create your profile'),
        h('p', { class: 'muted', style: 'margin:0' }, editing ? 'Your old listings keep working with the new name.' : `One quick transaction on ${NET.name}. You only do this once.`),
        form), () => resolve(false));
    });
  }

  function modeModal() {
    const pick = (mode) => { close(); setMode(mode, { quiet: true }); if (mode === 'selling') startSell(); else go('#/'); };
    const close = openModal(h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Choose a mode' },
      h('button', { class: 'x-close', type: 'button', 'aria-label': 'Close', onclick: () => close() }, '×'),
      h('h2', {}, 'How are you using Resole today?'),
      h('p', { class: 'muted', style: 'margin:0' }, 'Switch anytime from the header. Same wallet, both roles, no transaction.'),
      h('div', { class: 'modes' },
        h('button', { class: 'mode-card', type: 'button', onclick: () => pick('selling') }, h('span', { class: 'ico', 'aria-hidden': 'true' }, '🏷️'), h('div', {}, h('b', {}, "I'M SELLING"), h('br'), h('span', {}, 'List shoes and apparel at your price.'))),
        h('button', { class: 'mode-card', type: 'button', onclick: () => pick('buying') }, h('span', { class: 'ico', 'aria-hidden': 'true' }, '👟'), h('div', {}, h('b', {}, "I'M BUYING"), h('br'), h('span', {}, 'Pay in BOT, straight to the seller.'))))));
  }

  // ============================================================
  // Render
  // ============================================================
  function render() {
    renderHeader();
    const r = route();
    let view;
    if (r.name === 'item') view = itemView(r.id);
    else if (r.name === 'bought') view = boughtView(r.id);
    else if (r.name === 'sell') view = sellView();
    else if (r.name === 'me') view = meView(r.tab);
    else view = homeView();
    $('app').replaceChildren(...[view].flat().filter(Boolean));
  }

  function boot() {
    if (PREVIEW) {
      const bar = $('preview-bar');
      bar.hidden = false;
      bar.textContent = `Preview mode · no contract set for ${NET.name} yet, so sales are simulated in this browser · add ?reset to start over`;
    }
    renderFooter();
    render();
    lastRoute = location.hash;
  }

  if (!window.ethers) {
    document.getElementById('app').textContent = 'Could not load ethers.js. Check your connection and reload.';
    return;
  }
  boot();
  store.init()
    .then(() => Promise.all([initWallet(), refresh()]))
    .catch((e) => { console.error(e); state.loadError = `Could not reach ${NET.name}. Check your connection and try again.`; render(); });
})();
</script>
