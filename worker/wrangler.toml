name = "resole-upload"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
# Comma-separated list of site origins allowed to call POST /upload (no trailing slash).
# Replace with your live domain(s); keep localhost only while developing.
ALLOWED_ORIGINS = "http://localhost:4606"

# The Pinata JWT is a secret, never a var:
#   npx wrangler secret put PINATA_JWT

# Optional: a KV namespace makes the 40 uploads / IP / hour limit hold across
# Worker instances (without it the count is kept in memory per instance).
#   npx wrangler kv namespace create RATE_KV
# [[kv_namespaces]]
# binding = "RATE_KV"
# id = "<namespace id>"

# Optional: with Cloudflare Images bound, photos larger than 1200px are scaled down
# in the Worker instead of being rejected. The site already resizes before upload.
# [images]
# binding = "IMAGES"
